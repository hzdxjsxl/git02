<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航天器奔月模拟沙盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Microsoft YaHei', sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 20, 40, 0.85);
            border: 1px solid rgba(100, 180, 255, 0.5);
            border-radius: 8px;
            padding: 16px 20px;
            min-width: 280px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(100, 180, 255, 0.2);
        }
        #info-panel h2 {
            font-size: 16px;
            color: #64b4ff;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(100, 180, 255, 0.3);
            padding-bottom: 8px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin: 6px 0;
            color: #aac;
        }
        .info-row .value {
            color: #fff;
            font-weight: bold;
        }
        .info-row .value.accent {
            color: #ffcc00;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(10, 20, 40, 0.85);
            border: 1px solid rgba(100, 180, 255, 0.5);
            border-radius: 8px;
            padding: 12px 20px;
            backdrop-filter: blur(10px);
        }
        .btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #1a4a8a, #0a2a5a);
            border: 1px solid rgba(100, 180, 255, 0.5);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn:hover {
            background: linear-gradient(135deg, #2a6aaa, #1a4a8a);
            box-shadow: 0 0 15px rgba(100, 180, 255, 0.5);
        }
        .btn.primary {
            background: linear-gradient(135deg, #d4a017, #a07010);
            border-color: #ffcc00;
        }
        .btn.primary:hover {
            background: linear-gradient(135deg, #e8b020, #c08010);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }
        #phase-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 20, 40, 0.85);
            border: 1px solid rgba(100, 180, 255, 0.5);
            border-radius: 8px;
            padding: 16px 20px;
            backdrop-filter: blur(10px);
        }
        #phase-indicator h3 {
            font-size: 14px;
            color: #64b4ff;
            margin-bottom: 8px;
        }
        .phase-step {
            font-size: 12px;
            color: #667;
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .phase-step.active {
            color: #ffcc00;
        }
        .phase-step.done {
            color: #6f6;
        }
        .phase-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #445;
        }
        .phase-step.active .phase-dot {
            background: #ffcc00;
            box-shadow: 0 0 8px #ffcc00;
        }
        .phase-step.done .phase-dot {
            background: #6f6;
        }
        #trajectory-legend {
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: rgba(10, 20, 40, 0.85);
            border: 1px solid rgba(100, 180, 255, 0.5);
            border-radius: 8px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
        }
        .legend-line {
            width: 24px;
            height: 3px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="info-panel">
        <h2>🛰️ 探测器状态监控</h2>
        <div class="info-row">
            <span>飞行时间:</span>
            <span class="value" id="flight-time">0.00 天</span>
        </div>
        <div class="info-row">
            <span>飞行速度:</span>
            <span class="value" id="velocity">0.00 km/s</span>
        </div>
        <div class="info-row">
            <span>距地球:</span>
            <span class="value" id="dist-earth">0.00 km</span>
        </div>
        <div class="info-row">
            <span>距月球:</span>
            <span class="value" id="dist-moon">0.00 km</span>
        </div>
        <div class="info-row">
            <span>当前阶段:</span>
            <span class="value accent" id="current-phase">待发射</span>
        </div>
    </div>

    <div id="phase-indicator">
        <h3>🚀 任务阶段</h3>
        <div class="phase-step" id="phase-0">
            <div class="phase-dot"></div>
            <span>地球停泊轨道</span>
        </div>
        <div class="phase-step" id="phase-1">
            <div class="phase-dot"></div>
            <span>地月转移轨道 (TLI)</span>
        </div>
        <div class="phase-step" id="phase-2">
            <div class="phase-dot"></div>
            <span>月球引力捕获</span>
        </div>
        <div class="phase-step" id="phase-3">
            <div class="phase-dot"></div>
            <span>月球轨道运行</span>
        </div>
    </div>

    <div id="trajectory-legend">
        <div class="legend-item">
            <div class="legend-line" style="background: #64b4ff;"></div>
            <span>地球引力范围</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background: #ffcc00;"></div>
            <span>地月转移轨道</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background: #ff8844;"></div>
            <span>月球捕获轨道</span>
        </div>
    </div>

    <div id="controls">
        <button class="btn primary" id="btn-launch">🚀 开始任务</button>
        <button class="btn" id="btn-pause">⏸ 暂停</button>
        <button class="btn" id="btn-reset">🔄 重置</button>
        <button class="btn" id="btn-speed-up">⏩ 加速</button>
        <button class="btn" id="btn-camera">🎥 视角</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="./main.js"></script>
</body>
</html>
