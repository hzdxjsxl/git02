<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>机房温控三维透视大盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', sans-serif; }
  #canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 12px 20px;
    background: linear-gradient(180deg, rgba(10,12,20,0.85) 0%, transparent 100%);
    color: #7ec8e3; z-index: 10; display: flex; justify-content: space-between;
    pointer-events: none;
  }
  #hud .title { font-size: 18px; font-weight: 600; letter-spacing: 2px; }
  #hud .stats { display: flex; gap: 24px; font-size: 13px; }
  #hud .stat-item { display: flex; flex-direction: column; align-items: flex-end; }
  #hud .stat-label { color: #5a7a8e; font-size: 11px; }
  #hud .stat-val { font-size: 16px; font-weight: 700; color: #7ec8e3; }
  #hud .stat-val.hot { color: #ff4d4d; }
  #legend {
    position: fixed; bottom: 20px; left: 20px; background: rgba(10,12,20,0.75);
    padding: 12px 16px; border-radius: 6px; border: 1px solid #1e3a4a;
    color: #7ec8e3; font-size: 12px; z-index: 10;
  }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #legend .swatch { width: 24px; height: 10px; border-radius: 2px; }
  #tooltip {
    position: fixed; pointer-events: none; background: rgba(10,12,20,0.95);
    padding: 10px 14px; border-radius: 6px; border: 1px solid #2a4a5e;
    color: #7ec8e3; font-size: 13px; z-index: 20; display: none;
    max-width: 260px;
  }
  #tooltip .rack-id { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  #tooltip .temp-row { display: flex; justify-content: space-between; gap: 16px; }
  #tooltip .temp-val { font-weight: 700; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div class="title">⚡ 机房温控三维透视大盘</div>
  <div class="stats">
    <div class="stat-item">
      <span class="stat-label">机柜总数</span>
      <span class="stat-val" id="rackCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">传感器数</span>
      <span class="stat-val" id="sensorCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">平均温度</span>
      <span class="stat-val" id="avgTemp">--</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">最高温度</span>
      <span class="stat-val hot" id="maxTemp">--</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">告警机柜</span>
      <span class="stat-val hot" id="alertCount">0</span>
    </div>
  </div>
</div>
<div id="legend">
  <div class="row"><div class="swatch" style="background:rgba(40,120,255,0.22);"></div>冷 (≤25°C)</div>
  <div class="row"><div class="swatch" style="background:rgba(100,140,220,0.55);"></div>温 (25-45°C)</div>
  <div class="row"><div class="swatch" style="background:rgba(220,90,60,0.85);"></div>热 (45-65°C)</div>
  <div class="row"><div class="swatch" style="background:rgba(255,30,30,1);"></div>告警 (>65°C)</div>
</div>
<div id="tooltip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a12);
renderer.autoClear = false;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0a12, 40, 120);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(35, 30, 50);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 10;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 2, 0);

const ambientLight = new THREE.AmbientLight(0x334466, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0x88aacc, 0.8);
dirLight.position.set(20, 30, 10);
scene.add(dirLight);

const pointLight1 = new THREE.PointLight(0x3366ff, 0.4, 60);
pointLight1.position.set(-15, 8, 15);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xff3344, 0.3, 50);
pointLight2.position.set(15, 5, -15);
scene.add(pointLight2);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x111825, roughness: 0.95, metalness: 0.05 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
scene.add(floor);

const gridHelper = new THREE.GridHelper(200, 60, 0x1a3355, 0x142038);
gridHelper.position.y = 0;
scene.add(gridHelper);

const rackVertexShader = `
  varying vec3 vNormal;
  varying vec3 vViewPos;
  varying vec3 vWorldPos;
  varying vec2 vUv;
  void main() {
    vUv = uv;
    vNormal = normalize(normalMatrix * normal);
    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
    vViewPos = mvPos.xyz;
    vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
    gl_Position = projectionMatrix * mvPos;
  }
`;

const rackFragmentShader = `
  uniform float uTemp;
  uniform float uTime;
  uniform float uIsHover;
  varying vec3 vNormal;
  varying vec3 vViewPos;
  varying vec3 vWorldPos;
  varying vec2 vUv;

  vec3 smooth3Color(float t) {
    vec3 iceBlue = vec3(0.18, 0.45, 1.0);
    vec3 coolPurple = vec3(0.45, 0.55, 0.95);
    vec3 warmOrange = vec3(0.95, 0.55, 0.35);
    vec3 fireRed = vec3(1.0, 0.15, 0.08);
    
    float t0 = smoothstep(0.0, 0.33, t);
    float t1 = smoothstep(0.33, 0.66, t);
    float t2 = smoothstep(0.66, 1.0, t);
    
    vec3 c0 = mix(iceBlue, coolPurple, t0);
    vec3 c1 = mix(c0, warmOrange, t1);
    vec3 c2 = mix(c1, fireRed, t2);
    return c2;
  }

  float smoothAlpha(float t) {
    float iceAlpha = 0.18;
    float warmAlpha = 0.55;
    float fireAlpha = 1.0;
    
    float tMid = smoothstep(0.0, 0.5, t);
    float tHigh = smoothstep(0.5, 1.0, t);
    
    float mid = mix(iceAlpha, warmAlpha, tMid);
    return mix(mid, fireAlpha, tHigh);
  }

  void main() {
    float t = clamp(uTemp, 0.0, 1.0);

    vec3 color = smooth3Color(t);
    float alpha = smoothAlpha(t);

    vec3 viewDir = normalize(-vViewPos);
    float fresnel = pow(1.0 - max(dot(vNormal, viewDir), 0.0), 2.2);
    vec3 edgeColor = mix(vec3(0.3, 0.6, 1.0), vec3(1.0, 0.35, 0.2), t);
    color += fresnel * 0.4 * edgeColor;
    alpha = min(1.0, alpha + fresnel * 0.2);

    float stripe = step(0.93, fract(vUv.y * 45.0));
    color *= (1.0 - stripe * 0.3);
    alpha *= (1.0 - stripe * 0.15);

    float ledGrid = step(0.96, fract(vUv.x * 85.0)) * step(0.94, fract(vUv.y * 22.0));
    float ledBright = mix(0.0, 1.0, smoothstep(0.35, 0.75, t));
    vec3 ledColor = mix(vec3(0.0, 1.0, 0.4), vec3(1.0, 0.1, 0.0), ledBright);
    color += ledGrid * ledColor * 0.8;
    alpha = max(alpha, ledGrid * 0.85);

    float pulse = sin(uTime * 2.5 + vWorldPos.y * 4.0 + vWorldPos.x * 2.0) * 0.5 + 0.5;
    vec3 pulseColor = mix(vec3(0.1, 0.4, 1.0), vec3(1.0, 0.1, 0.1), t);
    color += (pulse * 0.05) * pulseColor;

    color += uIsHover * vec3(0.25, 0.4, 0.6);
    alpha += uIsHover * 0.2;

    gl_FragColor = vec4(color, alpha);
  }
`;

const cableVertexShader = `
  attribute vec3 aLineDir;
  attribute float aAlphaBase;
  attribute float aColorTint;
  
  varying vec3 vViewDir;
  varying vec3 vLineDir;
  varying float vAlphaBase;
  varying float vColorTint;
  
  void main() {
    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
    vViewDir = normalize(-mvPos.xyz);
    vLineDir = normalize(mat3(modelViewMatrix) * aLineDir);
    vAlphaBase = aAlphaBase;
    vColorTint = aColorTint;
    gl_Position = projectionMatrix * mvPos;
  }
`;

const cableFragmentShader = `
  uniform float uTime;
  uniform float uTemp;
  varying vec3 vViewDir;
  varying vec3 vLineDir;
  varying float vAlphaBase;
  varying float vColorTint;
  
  void main() {
    float dotProduct = abs(dot(vLineDir, vViewDir));
    float angleFactor = pow(1.0 - dotProduct, 2.0);
    
    float distanceFade = 1.0;
    float alpha = vAlphaBase * angleFactor * distanceFade;
    
    vec3 blueTint = vec3(0.2, 0.55, 1.0);
    vec3 cyanTint = vec3(0.15, 0.8, 1.0);
    vec3 greenTint = vec3(0.2, 1.0, 0.5);
    vec3 warmTint = vec3(0.9, 0.5, 0.2);
    
    vec3 lineColor;
    if (vColorTint < 0.33) {
      lineColor = mix(blueTint, cyanTint, vColorTint * 3.0);
    } else if (vColorTint < 0.66) {
      lineColor = mix(cyanTint, greenTint, (vColorTint - 0.33) * 3.0);
    } else {
      lineColor = mix(greenTint, warmTint, (vColorTint - 0.66) * 3.0);
    }
    
    float flicker = 0.85 + 0.15 * sin(uTime * 7.0 + gl_FragCoord.x * 0.08 + gl_FragCoord.y * 0.05);
    float dataFlow = 0.7 + 0.3 * sin(uTime * 4.0 + gl_FragCoord.x * 0.02);
    
    vec3 finalColor = lineColor * flicker * dataFlow;
    
    gl_FragColor = vec4(finalColor, alpha);
  }
`;

const nodeVertexShader = `
  attribute float aAlphaBase;
  attribute float aColorTint;
  varying float vAlphaBase;
  varying float vColorTint;
  varying vec3 vViewPos;
  
  void main() {
    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
    vViewPos = mvPos.xyz;
    vAlphaBase = aAlphaBase;
    vColorTint = aColorTint;
    gl_Position = projectionMatrix * mvPos;
  }
`;

const nodeFragmentShader = `
  uniform float uTime;
  varying float vAlphaBase;
  varying float vColorTint;
  varying vec3 vViewPos;
  
  void main() {
    vec2 center = gl_PointCoord - vec2(0.5);
    float dist = length(center);
    if (dist > 0.5) discard;
    
    float glow = 1.0 - smoothstep(0.0, 0.5, dist);
    glow = pow(glow, 1.5);
    
    vec3 blueGlow = vec3(0.3, 0.6, 1.0);
    vec3 cyanGlow = vec3(0.2, 0.9, 1.0);
    vec3 greenGlow = vec3(0.3, 1.0, 0.6);
    vec3 warmGlow = vec3(1.0, 0.5, 0.2);
    
    vec3 nodeColor;
    if (vColorTint < 0.33) {
      nodeColor = mix(blueGlow, cyanGlow, vColorTint * 3.0);
    } else if (vColorTint < 0.66) {
      nodeColor = mix(cyanGlow, greenGlow, (vColorTint - 0.33) * 3.0);
    } else {
      nodeColor = mix(greenGlow, warmGlow, (vColorTint - 0.66) * 3.0);
    }
    
    float pulse = 0.8 + 0.2 * sin(uTime * 5.0 + vColorTint * 10.0);
    float alpha = vAlphaBase * glow * pulse;
    
    gl_FragColor = vec4(nodeColor * pulse, alpha);
  }
`;

function createRackMaterial(initialTemp) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTemp: { value: initialTemp },
      uTime: { value: 0 },
      uIsHover: { value: 0 }
    },
    vertexShader: rackVertexShader,
    fragmentShader: rackFragmentShader,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: true
  });
  return mat;
}

const RACK_W = 1.2;
const RACK_H = 4.0;
const RACK_D = 1.8;
const RACK_GAP = 0.4;
const RACK_SHELL_INSET = 0.02;

const rackMeshes = [];
const rackGroup = new THREE.Group();
scene.add(rackGroup);

let config = null;
let temperatureData = null;

function buildRacks() {
  while (rackGroup.children.length > 0) {
    const c = rackGroup.children[0];
    rackGroup.remove(c);
    c.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
    });
  }
  rackMeshes.length = 0;

  const rows = config.rackRows;
  const cols = config.rackCols;
  const totalWidth = cols * (RACK_W + RACK_GAP) - RACK_GAP;
  const totalDepth = rows * (RACK_D + RACK_GAP * 3) - RACK_GAP * 3;

  const offsetX = -totalWidth / 2 + RACK_W / 2;
  const offsetZ = -totalDepth / 2 + RACK_D / 2;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      const x = offsetX + c * (RACK_W + RACK_GAP);
      const z = offsetZ + r * (RACK_D + RACK_GAP * 3);

      const rack = new THREE.Group();
      rack.position.set(x, 0, z);
      rack.userData.rackIndex = idx;
      rack.userData.rackId = `R-${String(r + 1).padStart(2, '0')}-${String(c + 1).padStart(2, '0')}`;

      const frameGeom = new THREE.BoxGeometry(RACK_W * 1.02, RACK_H * 1.02, RACK_D * 1.02);
      const frameMat = new THREE.MeshBasicMaterial({
        color: 0x0a1520, wireframe: true, transparent: true, opacity: 0.12
      });
      const frame = new THREE.Mesh(frameGeom, frameMat);
      frame.position.y = RACK_H / 2;
      rack.add(frame);

      const shellGeom = new THREE.BoxGeometry(
        RACK_W - RACK_SHELL_INSET * 2,
        RACK_H - RACK_SHELL_INSET * 2,
        RACK_D - RACK_SHELL_INSET * 2
      );
      const shellMat = createRackMaterial(0.0);
      const shell = new THREE.Mesh(shellGeom, shellMat);
      shell.position.y = RACK_H / 2;
      shell.userData.isRackBody = true;
      shell.userData.rackIndex = idx;
      rack.add(shell);

      const internalNetwork = createInternalNetworkSystem();
      internalNetwork.position.y = RACK_H / 2;
      rack.add(internalNetwork);

      const serverTrays = createServerTrays();
      serverTrays.position.y = RACK_H / 2;
      rack.add(serverTrays);

      rackGroup.add(rack);
      rackMeshes.push({ 
        group: rack, 
        body: shell, 
        material: shellMat, 
        cables: internalNetwork,
        servers: serverTrays
      });
    }
  }

  document.getElementById('rackCount').textContent = rows * cols;
  document.getElementById('sensorCount').textContent = config.totalSensors;
}

function createServerTrays() {
  const group = new THREE.Group();
  const trayCount = 12;
  const trayHeight = (RACK_H * 0.85) / trayCount;
  const startY = -RACK_H * 0.4;

  for (let i = 0; i < trayCount; i++) {
    const y = startY + i * trayHeight;
    
    const trayGeom = new THREE.BoxGeometry(
      RACK_W * 0.85,
      trayHeight * 0.7,
      RACK_D * 0.8
    );
    const trayMat = new THREE.MeshStandardMaterial({
      color: 0x1a1a2e,
      metalness: 0.8,
      roughness: 0.3,
      transparent: true,
      opacity: 0.25
    });
    const tray = new THREE.Mesh(trayGeom, trayMat);
    tray.position.y = y;
    group.add(tray);

    const ledRowCount = 8;
    for (let l = 0; l < ledRowCount; l++) {
      const ledX = -RACK_W * 0.3 + (l / (ledRowCount - 1)) * RACK_W * 0.6;
      const ledGeom = new THREE.BoxGeometry(0.015, 0.015, 0.02);
      const ledMat = new THREE.MeshBasicMaterial({
        color: Math.random() > 0.1 ? 0x00ff44 : 0xff3300,
        transparent: true,
        opacity: 0.8
      });
      const led = new THREE.Mesh(ledGeom, ledMat);
      led.position.set(ledX, y, RACK_D * 0.38);
      group.add(led);
    }
  }

  return group;
}

function createInternalNetworkSystem() {
  const group = new THREE.Group();
  
  const allPositions = [];
  const allLineDirs = [];
  const allAlphas = [];
  const allColorTints = [];
  const allNodePositions = [];
  const allNodeAlphas = [];
  const allNodeColorTints = [];

  const nodeCount = 0;
  const connectionPoints = [];

  const frontPorts = [];
  const backPorts = [];
  const switchPorts = [];

  const portRows = 6;
  const portCols = 8;
  for (let r = 0; r < portRows; r++) {
    for (let c = 0; c < portCols; c++) {
      const y = -RACK_H * 0.35 + (r / (portRows - 1)) * RACK_H * 0.7;
      const x = -RACK_W * 0.3 + (c / (portCols - 1)) * RACK_W * 0.6;
      
      frontPorts.push({ x, y, z: RACK_D * 0.25 });
      backPorts.push({ x, y, z: -RACK_D * 0.25 });
      
      switchPorts.push({ 
        x: (Math.random() - 0.5) * RACK_W * 0.4, 
        y: -RACK_H * 0.15 + Math.random() * RACK_H * 0.1,
        z: 0 
      });
    }
  }

  const patchBays = [];
  for (let i = 0; i < 4; i++) {
    const y = -RACK_H * 0.35 + i * RACK_H * 0.22;
    for (let j = 0; j < 24; j++) {
      patchBays.push({
        x: -RACK_W * 0.35 + (j / 23) * RACK_W * 0.7,
        y: y,
        z: RACK_D * 0.1 + (i % 2) * RACK_D * 0.1
      });
    }
  }

  connectionPoints.push(...frontPorts, ...backPorts, ...switchPorts, ...patchBays);

  const horizontalCableCount = 20;
  for (let h = 0; h < horizontalCableCount; h++) {
    const y = -RACK_H * 0.4 + Math.random() * RACK_H * 0.8;
    const z = -RACK_D * 0.35 + Math.random() * RACK_D * 0.7;
    const startX = -RACK_W * 0.45;
    const endX = RACK_W * 0.45;
    
    const segments = 8 + Math.floor(Math.random() * 8);
    let prevX = startX;
    let prevY = y + (Math.random() - 0.5) * 0.05;
    let prevZ = z + (Math.random() - 0.5) * 0.05;
    
    for (let s = 0; s < segments; s++) {
      const t = (s + 1) / segments;
      const currX = startX + (endX - startX) * t;
      const currY = y + (Math.random() - 0.5) * 0.08;
      const currZ = z + (Math.random() - 0.5) * 0.08;
      
      allPositions.push(prevX, prevY, prevZ);
      allPositions.push(currX, currY, currZ);
      
      const dx = currX - prevX;
      const dy = currY - prevY;
      const dz = currZ - prevZ;
      const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
      allLineDirs.push(dx/len, dy/len, dz/len);
      allLineDirs.push(dx/len, dy/len, dz/len);
      
      const alpha = 0.3 + Math.random() * 0.4;
      allAlphas.push(alpha, alpha);
      
      const tint = Math.random();
      allColorTints.push(tint, tint);
      
      prevX = currX;
      prevY = currY;
      prevZ = currZ;
    }
  }

  const verticalCableCount = 25;
  for (let v = 0; v < verticalCableCount; v++) {
    const x = -RACK_W * 0.4 + Math.random() * RACK_W * 0.8;
    const z = -RACK_D * 0.35 + Math.random() * RACK_D * 0.7;
    const startY = -RACK_H * 0.45;
    const endY = RACK_H * 0.45;
    
    const segments = 10 + Math.floor(Math.random() * 10);
    let prevX = x + (Math.random() - 0.5) * 0.05;
    let prevY = startY;
    let prevZ = z + (Math.random() - 0.5) * 0.05;
    
    for (let s = 0; s < segments; s++) {
      const t = (s + 1) / segments;
      const currX = x + (Math.random() - 0.5) * 0.06;
      const currY = startY + (endY - startY) * t;
      const currZ = z + (Math.random() - 0.5) * 0.06;
      
      allPositions.push(prevX, prevY, prevZ);
      allPositions.push(currX, currY, currZ);
      
      const dx = currX - prevX;
      const dy = currY - prevY;
      const dz = currZ - prevZ;
      const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
      allLineDirs.push(dx/len, dy/len, dz/len);
      allLineDirs.push(dx/len, dy/len, dz/len);
      
      const alpha = 0.35 + Math.random() * 0.35;
      allAlphas.push(alpha, alpha);
      
      const tint = Math.random();
      allColorTints.push(tint, tint);
      
      prevX = currX;
      prevY = currY;
      prevZ = currZ;
    }
  }

  const depthCableCount = 18;
  for (let d = 0; d < depthCableCount; d++) {
    const x = -RACK_W * 0.35 + Math.random() * RACK_W * 0.7;
    const y = -RACK_H * 0.4 + Math.random() * RACK_H * 0.8;
    const startZ = -RACK_D * 0.35;
    const endZ = RACK_D * 0.35;
    
    const segments = 6 + Math.floor(Math.random() * 8);
    let prevX = x + (Math.random() - 0.5) * 0.04;
    let prevY = y + (Math.random() - 0.5) * 0.04;
    let prevZ = startZ;
    
    for (let s = 0; s < segments; s++) {
      const t = (s + 1) / segments;
      const currX = x + (Math.random() - 0.5) * 0.05;
      const currY = y + (Math.random() - 0.5) * 0.05;
      const currZ = startZ + (endZ - startZ) * t;
      
      allPositions.push(prevX, prevY, prevZ);
      allPositions.push(currX, currY, currZ);
      
      const dx = currX - prevX;
      const dy = currY - prevY;
      const dz = currZ - prevZ;
      const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
      allLineDirs.push(dx/len, dy/len, dz/len);
      allLineDirs.push(dx/len, dy/len, dz/len);
      
      const alpha = 0.4 + Math.random() * 0.35;
      allAlphas.push(alpha, alpha);
      
      const tint = Math.random();
      allColorTints.push(tint, tint);
      
      prevX = currX;
      prevY = currY;
      prevZ = currZ;
    }
  }

  const diagonalCount = 35;
  for (let diag = 0; diag < diagonalCount; diag++) {
    const idx1 = Math.floor(Math.random() * connectionPoints.length);
    const idx2 = Math.floor(Math.random() * connectionPoints.length);
    if (idx1 === idx2) continue;
    
    const p1 = connectionPoints[idx1];
    const p2 = connectionPoints[idx2];
    
    const dist = Math.sqrt(
      Math.pow(p2.x - p1.x, 2) + 
      Math.pow(p2.y - p1.y, 2) + 
      Math.pow(p2.z - p1.z, 2)
    );
    if (dist > RACK_H * 0.7) continue;
    
    const segments = 3 + Math.floor(Math.random() * 5);
    const points = [];
    points.push({ x: p1.x, y: p1.y, z: p1.z });
    
    for (let s = 1; s < segments; s++) {
      const t = s / segments;
      points.push({
        x: p1.x + (p2.x - p1.x) * t + (Math.random() - 0.5) * 0.08,
        y: p1.y + (p2.y - p1.y) * t + (Math.random() - 0.5) * 0.08,
        z: p1.z + (p2.z - p1.z) * t + (Math.random() - 0.5) * 0.08
      });
    }
    points.push({ x: p2.x, y: p2.y, z: p2.z });
    
    for (let s = 0; s < points.length - 1; s++) {
      const pa = points[s];
      const pb = points[s + 1];
      
      allPositions.push(pa.x, pa.y, pa.z);
      allPositions.push(pb.x, pb.y, pb.z);
      
      const dx = pb.x - pa.x;
      const dy = pb.y - pa.y;
      const dz = pb.z - pa.z;
      const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
      allLineDirs.push(dx/len, dy/len, dz/len);
      allLineDirs.push(dx/len, dy/len, dz/len);
      
      const alpha = 0.35 + Math.random() * 0.35;
      allAlphas.push(alpha, alpha);
      
      const tint = Math.random();
      allColorTints.push(tint, tint);
    }
  }

  for (const pt of connectionPoints) {
    allNodePositions.push(pt.x, pt.y, pt.z);
    allNodeAlphas.push(0.5 + Math.random() * 0.3);
    allNodeColorTints.push(Math.random());
  }

  if (allPositions.length > 0) {
    const cableGeom = new THREE.BufferGeometry();
    cableGeom.setAttribute('position', new THREE.Float32BufferAttribute(allPositions, 3));
    cableGeom.setAttribute('aLineDir', new THREE.Float32BufferAttribute(allLineDirs, 3));
    cableGeom.setAttribute('aAlphaBase', new THREE.Float32BufferAttribute(allAlphas, 1));
    cableGeom.setAttribute('aColorTint', new THREE.Float32BufferAttribute(allColorTints, 1));
    cableGeom.computeBoundingSphere();

    const cableMat = new THREE.ShaderMaterial({
      uniforms: { 
        uTime: { value: 0 },
        uTemp: { value: 0 }
      },
      vertexShader: cableVertexShader,
      fragmentShader: cableFragmentShader,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      linewidth: 1
    });

    const cableLines = new THREE.LineSegments(cableGeom, cableMat);
    cableLines.userData.isCableSystem = true;
    group.add(cableLines);
  }

  if (allNodePositions.length > 0) {
    const nodeGeom = new THREE.BufferGeometry();
    nodeGeom.setAttribute('position', new THREE.Float32BufferAttribute(allNodePositions, 3));
    nodeGeom.setAttribute('aAlphaBase', new THREE.Float32BufferAttribute(allNodeAlphas, 1));
    nodeGeom.setAttribute('aColorTint', new THREE.Float32BufferAttribute(allNodeColorTints, 1));
    nodeGeom.computeBoundingSphere();

    const nodeMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: nodeVertexShader,
      fragmentShader: nodeFragmentShader,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      size: 6,
      sizeAttenuation: true
    });

    const nodes = new THREE.Points(nodeGeom, nodeMat);
    nodes.userData.isNodeSystem = true;
    group.add(nodes);
  }

  const busPositions = [];
  const busDirs = [];
  const busAlphas = [];
  const busTints = [];
  
  for (let side = 0; side < 2; side++) {
    const sideX = side === 0 ? -RACK_W * 0.42 : RACK_W * 0.42;
    for (let z = 0; z < 3; z++) {
      const busZ = -RACK_D * 0.3 + z * RACK_D * 0.3;
      
      busPositions.push(sideX, -RACK_H * 0.45, busZ);
      busPositions.push(sideX, RACK_H * 0.45, busZ);
      busDirs.push(0, 1, 0, 0, 1, 0);
      busAlphas.push(0.5, 0.5);
      busTints.push(0.1, 0.1);
    }
  }
  
  const busGeom = new THREE.BufferGeometry();
  busGeom.setAttribute('position', new THREE.Float32BufferAttribute(busPositions, 3));
  busGeom.setAttribute('aLineDir', new THREE.Float32BufferAttribute(busDirs, 3));
  busGeom.setAttribute('aAlphaBase', new THREE.Float32BufferAttribute(busAlphas, 1));
  busGeom.setAttribute('aColorTint', new THREE.Float32BufferAttribute(busTints, 1));
  
  const busMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uTemp: { value: 0 } },
    vertexShader: cableVertexShader,
    fragmentShader: cableFragmentShader,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  
  const busLines = new THREE.LineSegments(busGeom, busMat);
  group.add(busLines);

  return group;
}

function updateRackTemperatures() {
  if (!temperatureData || !config) return;
  const { rackRows, rackCols, sensorsPerRack } = config;
  let globalSum = 0;
  let globalMax = -Infinity;
  let alertCount = 0;

  for (let r = 0; r < rackRows; r++) {
    for (let c = 0; c < rackCols; c++) {
      const idx = r * rackCols + c;
      const sensorBase = idx * sensorsPerRack;
      let sum = 0;
      let maxT = -Infinity;
      for (let s = 0; s < sensorsPerRack; s++) {
        const t = temperatureData[sensorBase + s];
        sum += t;
        if (t > maxT) maxT = t;
      }
      const avg = sum / sensorsPerRack;
      globalSum += sum;
      if (maxT > globalMax) globalMax = maxT;
      if (maxT > 65) alertCount++;

      const normalized = (avg - 15) / 70;
      if (rackMeshes[idx]) {
        rackMeshes[idx].material.uniforms.uTemp.value = normalized;
        rackMeshes[idx].group.userData.avgTemp = avg;
        rackMeshes[idx].group.userData.maxTemp = maxT;
        
        rackMeshes[idx].cables.traverse(obj => {
          if (obj.material && obj.material.uniforms && obj.material.uniforms.uTemp) {
            obj.material.uniforms.uTemp.value = normalized;
          }
        });
      }
    }
  }

  const totalSensors = config.totalSensors;
  document.getElementById('avgTemp').textContent = (globalSum / totalSensors).toFixed(1) + '°C';
  document.getElementById('maxTemp').textContent = globalMax.toFixed(1) + '°C';
  document.getElementById('alertCount').textContent = alertCount;
}

function updateShaderTime(t) {
  for (const rm of rackMeshes) {
    rm.material.uniforms.uTime.value = t;
    rm.cables.traverse(obj => {
      if (obj.material && obj.material.uniforms && obj.material.uniforms.uTime) {
        obj.material.uniforms.uTime.value = t;
      }
    });
  }
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hoveredRack = null;

function onPointerMove(e) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const bodies = rackMeshes.map(rm => rm.body);
  const hits = raycaster.intersectObjects(bodies, false);

  if (hits.length > 0) {
    const hit = hits[0];
    const idx = hit.object.userData.rackIndex;
    if (hoveredRack !== idx) {
      if (hoveredRack !== null && rackMeshes[hoveredRack]) {
        rackMeshes[hoveredRack].material.uniforms.uIsHover.value = 0;
      }
      hoveredRack = idx;
      rackMeshes[idx].material.uniforms.uIsHover.value = 1;
    }
    const ud = rackMeshes[idx].group.userData;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
    tooltip.innerHTML = `
      <div class="rack-id">${ud.rackId}</div>
      <div class="temp-row"><span>平均温度</span><span class="temp-val">${ud.avgTemp ? ud.avgTemp.toFixed(1) + '°C' : '--'}</span></div>
      <div class="temp-row"><span>最高温度</span><span class="temp-val" style="color:${ud.maxTemp > 65 ? '#ff4d4d' : '#7ec8e3'}">${ud.maxTemp ? ud.maxTemp.toFixed(1) + '°C' : '--'}</span></div>
      <div class="temp-row"><span>传感器</span><span>${config.sensorsPerRack}</span></div>
      <div class="temp-row"><span>状态</span><span style="color:${ud.maxTemp > 65 ? '#ff4d4d' : '#50e890'}">${ud.maxTemp > 65 ? '⚠ 告警' : '✓ 正常'}</span></div>
    `;
  } else {
    if (hoveredRack !== null && rackMeshes[hoveredRack]) {
      rackMeshes[hoveredRack].material.uniforms.uIsHover.value = 0;
    }
    hoveredRack = null;
    tooltip.style.display = 'none';
  }
}
canvas.addEventListener('pointermove', onPointerMove);

const ws = new WebSocket(`ws://${location.host}`);
ws.binaryType = 'arraybuffer';

ws.onmessage = (event) => {
  if (typeof event.data === 'string') {
    const msg = JSON.parse(event.data);
    if (msg.type === 'config') {
      config = msg;
      temperatureData = new Float32Array(config.totalSensors);
      buildRacks();
    }
  } else {
    temperatureData = new Float32Array(event.data);
    updateRackTemperatures();
  }
};

ws.onclose = () => console.log('WebSocket closed');
ws.onerror = (e) => console.error('WebSocket error', e);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();
  updateShaderTime(t);

  pointLight1.intensity = 0.35 + Math.sin(t * 2) * 0.15;
  pointLight2.intensity = 0.25 + Math.sin(t * 1.7 + 1) * 0.12;

  renderer.clear();
  renderer.render(scene, camera);
}
animate();
</script>
