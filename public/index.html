<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>驾考刷题 · 时光回溯版</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="app">
  <header class="top-bar">
    <h1>🚗 驾考刷题 · 时光回溯版</h1>
    <div class="stats">
      <span>已答: <b id="answered-count">0</b> / <b id="total-count">100</b></span>
      <span>正确: <b id="correct-count" class="correct">0</b></span>
      <span>用时: <b id="elapsed-time">00:00</b></span>
      <button id="restart-btn" class="btn btn-ghost">重新抽题</button>
    </div>
  </header>

  <main class="exam-area">
    <div class="question-panel">
      <div class="question-meta">
        <span class="q-number">第 <b id="q-number">1</b> 题</span>
        <span class="q-type" id="q-type">单选题</span>
        <span class="q-category" id="q-category">法规</span>
      </div>
      <h2 class="question-text" id="question-text">加载中...</h2>
      <div class="options" id="options-container"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <aside class="side-panel">
      <div class="question-grid" id="question-grid"></div>
      <div class="legend">
        <span><i class="dot unanswered"></i>未答</span>
        <span><i class="dot answered"></i>已答</span>
        <span><i class="dot correct"></i>正确</span>
        <span><i class="dot wrong"></i>错误</span>
        <span><i class="dot current"></i>当前</span>
      </div>
    </aside>
  </main>

  <div class="timeline-section">
    <div class="timeline-header">
      <h3>⏰ 答题状态时间轴（可拖动回溯）</h3>
      <div class="timeline-controls">
        <button id="play-btn" class="btn btn-primary">▶ 回放</button>
        <button id="pause-btn" class="btn btn-ghost" disabled>⏸ 暂停</button>
        <button id="reset-timeline-btn" class="btn btn-ghost">↺ 回到现在</button>
        <label class="mode-toggle">
          <input type="checkbox" id="time-travel-mode">
          <span>启用时光回溯（点击时间条可跳转）</span>
        </label>
      </div>
    </div>
    <div class="timeline-wrapper">
      <div class="timeline-track" id="timeline-track">
        <div class="timeline-fill" id="timeline-fill"></div>
        <div class="timeline-thumb" id="timeline-thumb"></div>
      </div>
      <div class="timeline-labels">
        <span id="timeline-start">00:00</span>
        <span id="timeline-current" class="timeline-current-label">00:00</span>
        <span id="timeline-end">30:00</span>
      </div>
    </div>
    <div class="timeline-info" id="timeline-info">
      点击时间条上的任意位置，可让整张卷子回放到那个时刻的答题状态。
    </div>
  </div>
</div>

<script src="/js/SnapshotEngine.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
