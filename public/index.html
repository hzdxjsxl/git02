<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短视频流失数据分析看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e4e4e7;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #f97316, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(249, 115, 22, 0.2);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #f97316;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .funnel-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
        }

        .funnel-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .funnel-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #f97316, #ec4899);
            border-radius: 2px;
        }

        .funnel-svg {
            flex: 1;
            max-width: 750px;
            min-width: 400px;
        }

        .funnel-segment {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .funnel-text {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .funnel-leader {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .funnel-wrapper {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .funnel-legend {
            flex: 0 0 auto;
            min-width: 280px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .legend-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .legend-text {
            flex: 1;
        }

        .legend-step {
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 2px;
        }

        .legend-details {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .churn-rate {
            color: #ef4444;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(249, 115, 22, 0.2);
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .refresh-btn {
            display: block;
            margin: 0 auto;
            padding: 12px 32px;
            background: linear-gradient(90deg, #f97316, #ec4899);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .test-btn {
            padding: 12px 24px;
            background: transparent;
            border: 2px solid rgba(239, 68, 68, 0.6);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .test-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #f87171;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 短视频流失数据分析看板</h1>
            <p>用户观看路径漏斗分析 - 每一层高度严格对应流失人数比例</p>
        </div>

        <div id="stats" class="stats-cards"></div>

        <div class="funnel-container">
            <div class="funnel-title">用户流失漏斗图</div>
            <div id="funnel-content">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载数据...</p>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="refresh-btn" onclick="loadData()">🔄 刷新数据</button>
            <button class="test-btn" onclick="loadData(true)">⚠️ 测试零留存模式</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
